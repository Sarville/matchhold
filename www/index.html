<!DOCTYPE html>
<html>
	<head>
		<!-- 
			Matchhold (v1.1)
			====================
			
			Based on Gridland by doublespeak games (MPL 2.0).

			Code, game design and graphics by Michael Townsend
			Music by Vince Nitro (http://rule2.the-back-row.com)
		 -->
		<meta name="viewport" content="width=device-width">
		<script>if(location.search.indexOf('debug')>=0){document.documentElement.className+=' debug';}</script>
		<title>Matchhold</title>
		<meta itemprop="description" name="description" property="og:description" content="Match. Build. Survive.">
		<meta itemprop="image" property="og:image" content="img/badge.png" />
		<meta itemprop="name" property="og:title" content="Matchhold" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="shortcut icon" href="favicon.ico">
		<link rel="image_src" href="img/badge.png" />
		<link rel="apple-touch-icon" href="img/badge.png" />
		<link rel="preload" as="font" type="font/woff2" href="fonts/AlegreyaSC-900.woff2" crossorigin>
		<link rel="preload" as="font" type="font/woff2" href="fonts/AlegreyaSC-700.woff2" crossorigin>
		<link rel="stylesheet" type="text/css" href="css/main.css" />
		<link rel="stylesheet" type="text/css" href="css/art.css" />
		<link rel="stylesheet" type="text/css" href="css/bg.css" />
		<link rel="stylesheet" type="text/css" href="css/store.css" />
		<link rel="stylesheet" type="text/css" href="css/ui.css" />
		<script type="text/javascript" data-main="js/app" src="js/lib/require.js"></script>
		<style>
			@viewport {
				width: device-width;
				max-zoom: 1;
				orientation: portrait;
				user-zoom: fixed;
			}
			@-ms-viewport {
				width: device-width;
				max-zoom: 1;
				orientation: portrait;
				user-zoom: fixed;
			}
			@-o-viewport {
				width: device-width;
				max-zoom: 1;
				orientation: portrait;
				user-zoom: fixed;
			}
		</style>
	</head>
	<body class="titleScreen stage1">
		<div id="bg">
			<div class="far day"></div><div class="far night"></div>
			<div class="mid day"></div><div class="mid night"></div>
			<div class="far drbg"></div><div class="mid drbg"></div>
		</div>
		<div id="fg"><div class="day"></div><div class="night"></div><div class="drbg"></div></div>
		<div id="test" nodeploy></div>
		<div id="pauseIcon"><i class="pauseBadge"></i><h2 data-i18n="PAUSED"></h2><p data-i18n="TAP_TO_RESUME"></p></div>
		<div id="loadingScreen" data-clickable>
			<div class="titleMain">
				<h1 class="logo"><span class="a"></span><i class="coin"></i><span class="b"></span></h1>
				<script>(function(){var l;try{l=JSON.parse(localStorage.gameOptions).lang}catch(e){}if(l!="ru"&&l!="en")l=/^ru/i.test(navigator.language||"")?"ru":"en";var q=document.querySelectorAll(".logo span");q[0].textContent=l=="ru"?"\u041c\u0410\u0422\u0427\u0425":"MATCHH";q[1].textContent=l=="ru"?"\u041b\u0414":"LD"})()</script>
				<div class="logoTiles"><i style="--c:1"></i><i style="--c:4"></i><i style="--c:0"></i><i style="--c:3"></i><i style="--c:5"></i></div>
				<div class="emblem"></div>
				<div class="slotsArea">
					<div class="loader"><div class="track"><div class="walker"><i class="hero"></i><i class="gi a"></i><i class="gi b"></i></div></div><p></p></div>
					<script>(function(){var l;try{l=JSON.parse(localStorage.gameOptions).lang}catch(e){}if(l!="ru"&&l!="en")l=/^ru/i.test(navigator.language||"")?"ru":"en";var L=document.querySelector(".loader"),p=L.querySelector("p"),g=L.querySelectorAll(".gi"),tips,ti=-1,c=Math.floor(Math.random()*6);function res(){g[0].style.setProperty("--c",c%6);g[1].style.setProperty("--c",(c+1)%6);c+=2}function tip(){if(tips){ti=(ti+1+Math.floor(Math.random()*(tips.length-1)))%tips.length;p.textContent=tips[ti]}}res();L.querySelector(".walker").addEventListener("animationiteration",function(e){if(e.animationName=="ldWalk")res()});p.addEventListener("animationiteration",tip);document.addEventListener("mhtips",function(e){tips=e.detail;tip()})})()</script>
					<ul class="saveSlots"></ul>
				</div>
				<div class="titleBar">
					<button type="button" class="btn wide" id="btnSettings"><span data-icon="gear"></span><span data-i18n="SETTINGS"></span></button>
					<button type="button" class="btn round" id="btnLang"></button>
				</div>
			</div>
		</div>
		<div id="gameContainer"></div>
		<div class="menuBtn" data-clickable><span></span></div>
		<div id="debug" style="position:fixed;top:5px;left:100px;" nodeploy></div>
		<div class="saveSpinner">
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
		<div id="settings" class="overlay" data-clickable>
			<div class="panel settingsPanel">
				<button type="button" class="btn wide onlyGame" id="btnContinue" data-i18n="CONTINUE"></button>
				<button type="button" class="btn wide onlyTitle" id="btnBack" data-i18n="BACK"></button>
				<div class="volRow" data-opt="musicVolume"><span class="ico" data-icon="music"></span><div class="bar"><i class="fill"></i><i class="knob"></i></div></div>
				<div class="volRow" data-opt="effectsVolume"><span class="ico" data-icon="sound"></span><div class="bar"><i class="fill"></i><i class="knob"></i></div></div>
				<h3 class="sect"><span data-i18n="DIFFICULTY"></span></h3>
				<div class="diff">
					<span class="opt easy"><span data-icon="leaf"></span><span data-i18n="EASY"></span></span>
					<span class="opt hard"><span data-icon="sword"></span><span data-i18n="NORMAL"></span></span>
					<i class="knob"></i>
				</div>
				<div class="langSwitch"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
				<button type="button" class="btn wide" id="btnHow"><span data-icon="book"></span><span data-i18n="HOW_TO_PLAY"></span></button>
				<button type="button" class="btn wide" id="btnSupport"><span data-icon="heart"></span><span class="lbl"><span data-i18n="REMOVE_ADS"></span><span class="price" id="upsellPrice"></span></span></button>
				<button type="button" class="btn wide" id="btnMore"><span data-icon="gamepad"></span><span data-i18n="MORE_GAMES"></span></button>
				<button type="button" class="btn wide danger onlyGame" id="btnExit" data-i18n="EXIT_MENU"></button>
			</div>
		</div>
		<div id="modal" class="overlay" data-clickable>
			<div class="panel modalPanel"></div>
		</div>
	</body>
</html>
