<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Монстры: анимации</title>
<link rel="stylesheet" href="../../css/main.css">
<link rel="stylesheet" href="../../css/art.css">
<style>
body{margin:0;padding:16px;font:14px system-ui;background:#1c2340;color:#fff}
h1{font-size:18px;margin:0 0 8px}
#g{display:flex;flex-wrap:wrap;gap:16px}
.c{background:rgba(0,0,0,.35);border-radius:8px;padding:10px;text-align:center}
.stage{position:relative;background:rgba(255,255,255,.06);margin:0 auto 6px;overflow:visible}
.monster{position:absolute!important;left:0;bottom:0;background-repeat:no-repeat}
.rowlabel{font-size:11px;opacity:.8}
</style>
<h1>Монстры: walk / attack / die (ряды 1,3,5 живого кода; 7 = lich_spell)</h1>
<label>скорость <input type=range id=sp min=2 max=10 value=5> <span id=v>5</span> к/с</label>
<label>ряд
 <select id=row><option value=1 selected>walk (1)</option><option value=3>attack (3)</option><option value=5>die (5)</option><option value=7>spell (7, только lich)</option></select>
</label>
<div id=g></div>
<script>
const NAMES=["zombie","skeleton","hauntedArmour","demon","rat","spider","waterElemental","imp","lizardman","fireElemental","warlock","earthElemental","lich"];
const g=document.getElementById('g');
const els=NAMES.map(name=>{
  const c=document.createElement('div');c.className='c';
  const stage=document.createElement('div');stage.className='stage';stage.style.width='140px';stage.style.height='100px';
  const m=document.createElement('div');m.className='monster '+name;
  stage.appendChild(m);c.appendChild(stage);
  const lbl=document.createElement('div');lbl.textContent=name;c.appendChild(lbl);
  g.appendChild(c);
  return {name,m};
});
const sp=document.getElementById('sp'),v=document.getElementById('v'),rowSel=document.getElementById('row');
let frame=0,timer=null;
function apply(){
  const row=+rowSel.value;
  els.forEach(({name,m})=>{
    const w=m.offsetWidth,h=m.offsetHeight;
    m.style.backgroundPosition=(-(frame*w))+'px '+(-(row*h))+'px';
  });
}
function tick(){frame=(frame+1)%4;apply();}
function restart(){clearInterval(timer);frame=0;apply();timer=setInterval(tick,1000/sp.value);}
[sp,rowSel].forEach(e=>e.oninput=()=>{v.textContent=sp.value;restart();});
restart();
</script>
